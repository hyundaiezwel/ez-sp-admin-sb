plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':vs-domain')
    implementation project(':vs-infra')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // STATELESS · CSRF/formLogin/httpBasic 끔. 인증 강제는 AuthInterceptor 가 한다(SecurityConfig 주석).
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 실행 모듈이라 Flyway 는 여기에만 둔다(H-PMS 와 같다).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'vs-api.jar'
}

// 로컬 기동 스크립트(scripts/local-dev-api.sh)는 bootJar 만 쓴다. 일반 jar 는 만들지 않는다.
jar {
    enabled = false
}
